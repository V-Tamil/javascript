<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Form</title>
    <style>
      .task {
        font-size: 50px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1 class="task">COMPLETE THIS TASK</h1>
    <div class="main_div">
      <h2>STUDENT FORM</h2>
      <form onsubmit="save(event)">
        <div>
          <label for="name">Name</label>
          <input type="text" name="name" id="name" />
        </div>
        <div>
          <label for="age">Age</label>
          <input type="number" name="age" id="age" />
        </div>
        <div>
          <label>Gender</label>
          <input type="radio" name="gender" id="male" value="Male" />
          <label for="male">Male</label>
          <input type="radio" name="gender" id="female" value="Female" />
          <label for="female">Female</label>
        </div>
        <div>
          <label for="course">Course</label>
          <input type="text" name="course" id="course" />
        </div>
        <div>
          <label for="email">E-mail</label>
          <input type="email" name="email" id="email" />
        </div>
        <button type="submit">Save</button>
      </form>
      <table class="list">
        <thead>
          <tr>
            <th>NAME</th>
            <th>AGE</th>
            <th>GENDER</th>
            <th>COURSE</th>
            <th>EMAIL</th>
            <th>ACTION</th>
          </tr>
        </thead>
        <tbody class="t_body"></tbody>
      </table>
    </div>
    <script>
      function save(e) {
        e.preventDefault();

        const formElements = e.target.elements;
        const name = formElements.name.value;
        const age = formElements.age.value;
        const gender = formElements.gender.value;
        const course = formElements.course.value;
        const email = formElements.email.value;

        let list = document.querySelector(".t_body");
        let tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${name}</td>
          <td>${age}</td>
          <td>${gender}</td>
          <td>${course}</td>
          <td>${email}</td>
          <td><button onclick="deleteItem(this)">Delete</button></td>
        `;

        list.appendChild(tr);
      }

      function deleteItem(button) {
        button.parentElement.parentElement.remove();
      }
    </script>
  </body>
</html>
